name: Cloud Package Builder & Release

on:
  repository_dispatch:
    types: [install_tool]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (patchelf, ar, etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf binutils tar gzip

      - name: Run Cloud Builder Script
        env:
          TOOL_NAME: ${{ github.event.client_payload.tool }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cloud_builder.py

      - name: Commit and push updated packages.json manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add packages.json
          git commit -m "chore: update manifest for ${{ github.event.client_payload.tool }}" || echo "No changes to commit"
          git push
