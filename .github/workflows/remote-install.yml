name: Cloud Package Builder

on:
  repository_dispatch:
    types: [install_tool]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install patchelf and binutils
        run: sudo apt-get update && sudo apt-get install -y patchelf binutils

      - name: Run Cloud Builder Script
        env:
          TOOL_NAME: ${{ github.event.client_payload.tool }}
        run: python scripts/cloud_builder.py "$TOOL_NAME"

      - name: Commit and Push Updated Manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add packages.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Cloud build: Added/Updated package via app request" && git push)
