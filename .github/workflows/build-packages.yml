name: Build and Release Backend Packages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v3
        with:
          ndk-version: r27c
          android-version: 36

      - name: Install WASI SDK
        run: |
          wget https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-22/wasi-sdk-22.0-linux.tar.gz
          tar -xzf wasi-sdk-22.0-linux.tar.gz
          sudo mv wasi-sdk-22.0 /opt/wasi-sdk

      - name: Build Android 16 Host Runner (WAMR)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd host-runtime
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-36 \
                -DCMAKE_C_FLAGS="-Wl,-z,max-page-size=16384" \
                -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384" \
                ..
          make

      - name: Build WASM Packages
        run: |
          mkdir -p dist/wasm dist/host
          cp host-runtime/build/libwasi_host.so dist/host/
          
          export WASI_SDK_PATH=/opt/wasi-sdk
          for pkg in packages/*; do
            if [ -d "$pkg" ]; then
              bash "$pkg/build.sh" dist/wasm
            fi
          done

      - name: Generate Package Index JSON
        run: |
          python3 scripts/generate-index.py dist/wasm dist/packages.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/host/*
            dist/wasm/*
            dist/packages.json
          tag_name: v1.0.${{ github.run_number }}
          name: "Backend Release v1.0.${{ github.run_number }}"
          body: "Automated build containing Android 16 host runner, .wasm packages, and updated package index."
          draft: false
          prerelease: false
